<div class="container-fluid gestione-lotti-page d-flex flex-column">
  <div class="row">
    <div class="col-12">
      <h2 class="page-title">{{ title }}</h2>
    </div>
  </div>

  <form
    [formGroup]="form"
    class="flex-grow-1"
    novalidate
    (ngSubmit)="onSubmit()"
  >
    <div class="row">

      <div class="col-12 mb-3">
        <label for="localeId" class="form-label">
          Locale <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-box-seam"></i></span>
          <select
            id="localeId"
            class="form-select"
            formControlName="localeId"
            [ngClass]="{ 'is-invalid': isFieldInvalid('localeId') }"
            (blur)="onBlurField('localeId')"
          >
            <option value="">Seleziona locale</option>
            <option *ngFor="let l of locali" [value]="l.id">
              {{ l.nome }}
            </option>
          </select>
          <div class="invalid-feedback" *ngIf="isFieldInvalid('localeId')">
            Seleziona un locale.
          </div>
        </div>
      </div>

      <div class="col-12 mb-3">
        <label for="fornitoreId" class="form-label">
          Fornitore <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-truck"></i></span>
          <select
            id="fornitoreId"
            class="form-select"
            formControlName="fornitoreId"
            [ngClass]="{ 'is-invalid': isFieldInvalid('fornitoreId') }"
            (blur)="onBlurField('fornitoreId')"
          >
            <option value="">Seleziona fornitore</option>
            <option *ngFor="let f of fornitori" [value]="f.id">
              {{ f.codiceProvenienza }}
            </option>
          </select>
          <div class="invalid-feedback" *ngIf="isFieldInvalid('fornitoreId')">
            Seleziona un fornitore.
          </div>
        </div>

      </div>

      <div class="col-12 mb-3">
        <label for="animaleId" class="form-label">
          Animale <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-egg"></i></span>
          <select
            id="animaleId"
            class="form-select"
            formControlName="animaleId"
            [ngClass]="{ 'is-invalid': isFieldInvalid('animaleId') }"
            (blur)="onBlurField('animaleId')"
          >
            <option value="">Seleziona animale</option>
            <option *ngFor="let a of animali" [value]="a.id">
              {{ a.razza }}
            </option>
          </select>
          <div class="invalid-feedback" *ngIf="isFieldInvalid('animaleId')">
            Seleziona un animale.
          </div>
        </div>
      </div>

      <div class="col-12 mb-3">
        <label for="dataDiNascita" class="form-label">
          Data di nascita <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
          <input
            id="dataDiNascita"
            type="date"
            class="form-control"
            formControlName="dataDiNascita"
            [ngClass]="{ 'is-invalid': isFieldInvalid('dataDiNascita') }"
            (blur)="onBlurField('dataDiNascita')"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('dataDiNascita')">
            Inserisci la data di nascita.
          </div>
        </div>

      </div>

      <div class="col-12 mb-3">
        <label for="quantitaIniziale" class="form-label">
          Quantità iniziale <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi bi-aspect-ratio"></i></span>
          <input
            id="quantitaIniziale"
            type="number"
            class="form-control"
            formControlName="quantitaIniziale"
            [ngClass]="{ 'is-invalid': isFieldInvalid('quantitaIniziale') }"
            (blur)="onBlurField('quantitaIniziale')"
            (input)="onQuantitaInizialeChanged()"
            min="1"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('quantitaIniziale')">
            Inserisci una quantità iniziale valida.
          </div>
        </div>

      </div>

      <div class="col-12 mb-3">
        <label for="quantitaCorrente" class="form-label">
          Quantità corrente <span class="text-danger">*</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi bi-aspect-ratio"></i></span>
          <input
            id="quantitaCorrente"
            type="number"
            class="form-control"
            formControlName="quantitaCorrente"
            [ngClass]="{ 'is-invalid': isFieldInvalid('quantitaCorrente') }"
            (blur)="onBlurField('quantitaCorrente')"
            min="0"
          />
          <div class="invalid-feedback" *ngIf="isFieldInvalid('quantitaCorrente')">
            Inserisci una quantità corrente valida.
          </div>
        </div>

      </div>

      <div class="col-12 mb-3">
        <label for="prezzoUnitario" class="form-label">
          Prezzo unitario
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-tag"></i></span>
          <input
            id="prezzoUnitario"
            type="number"
            step="0.01"
            class="form-control"
            formControlName="prezzoUnitario"
            (blur)="onBlurField('prezzoUnitario')"
          />
        </div>

      </div>
    </div>

    <!-- Spacer per non coprire il form col footer -->
    <div class="mb-5"></div>

    <div class="fixed-footer">
      <div class="container-fluid">
        <div class="row">
          <div class="col-12 d-flex gap-2">
            <button
              type="button"
              class="btn btn-outline-secondary flex-grow-1"
              (click)="onCancel()"
              [disabled]="isSubmitting"
            >
              Annulla
            </button>

            <button
              type="submit"
              class="btn btn-primary flex-grow-1"
              [disabled]="isSubmitting"
            >
              {{ isSubmitting ? 'Salvataggio...' : 'Salva' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
