<div class="container-fluid d-flex flex-column mt-3 p-3">
  <!-- TITOLO SEZIONE -->
  <div class="row">
    <div class="col-12">
      <h2 class="page-title">Gestione Cliente</h2>
    </div>
  </div>
  <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
    <div class="row">
      <div class="col-12">
        <label class="form-label">Nome *</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" formControlName="nome" [ngClass]="{'is-invalid': isInvalid('nome')}">
          <div class="invalid-feedback">Inserisci il nome.</div>
        </div>
      </div>
      <div class="col-12">
        <label class="form-label">Cognome *</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" formControlName="cognome"
                 [ngClass]="{'is-invalid': isInvalid('cognome')}">
          <div class="invalid-feedback">Inserisci il cognome.</div>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Cellulare *</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input type="tel" class="form-control" formControlName="cellulare"
                 [ngClass]="{'is-invalid': isInvalid('cellulare')}">
          <div class="invalid-feedback">Inserisci il numero di cellulare.</div>
        </div>
      </div>


      <div class="col-12">
        <label class="form-label">Provincia *</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-building"></i></span>
          <input type="text" class="form-control" formControlName="provincia"
                 [ngClass]="{'is-invalid': isInvalid('provincia')}">
          <div class="invalid-feedback">Inserisci la provincia.</div>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Comune *</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-house"></i></span>
          <input type="text" class="form-control" formControlName="comune"
                 [ngClass]="{'is-invalid': isInvalid('comune')}">
          <div class="invalid-feedback">Inserisci il comune.</div>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Indirizzo *</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
          <input type="text" class="form-control" formControlName="indirizzo"
                 [ngClass]="{'is-invalid': isInvalid('indirizzo')}">
          <div class="invalid-feedback">Inserisci l'indirizzo.</div>
        </div>
      </div>


      <div class="col-12">
        <label class="form-label">Data di nascita</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
          <input type="date" class="form-control" formControlName="dataNascita">
        </div>
      </div>


      <div class="col-12">
        <label class="form-label">Codice Fiscale</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-credit-card-2-front"></i></span>
          <input type="text" class="form-control" formControlName="codiceFiscale">
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">Codice Identificativo ASL</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-hospital"></i></span>
          <input type="text" class="form-control" formControlName="codiceIdentificativoAsl">
        </div>
      </div>

      <div class="col-12">
        <label class="form-label">email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-mailbox"></i></span>
          <input type="email" class="form-control" formControlName="email">
        </div>
      </div>

      <div class="mb-5"></div>


      <div class="fixed-footer">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12 d-flex gap-2">
              <button
                type="button"
                class="btn btn-outline-secondary flex-grow-1"
                (click)="onCancel()"
              >
                Annulla
              </button>

              <button type="submit" class="btn btn-primary flex-grow-1"
                      [ngClass]="{'disabled': this.userDetail.activeMode == 'view'}">
                <i></i>Salva
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </form>
</div>
